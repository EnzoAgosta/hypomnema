[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "hypomnema"
version = "0.9"
authors = [{ name = "Enzo Agosta", email = "agosta.enzowork@gmail.com" }]
description = "Python library for manipulating, creating and editing tmx files"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
]


[project.urls]
Homepage = "https://github.com/EnzoAgosta/hypomnema"
Issues = "https://github.com/EnzoAgosta/hypomnema/issues"

[project.optional-dependencies]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hypomnema = ["resources/*.dtd"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
    "types-lxml>=2026.2.16",
]
